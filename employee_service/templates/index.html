<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhân Viên - SOA Supermarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="toast-container" id="toastContainer"></div>
    <div class="container">
        <header class="header">
            <div class="header-title">
                <div class="icon">👨‍💼</div>
                <div>
                    <h1>Quản Lý Nhân Viên</h1>
                    <p>SOA Mini Supermarket Management System</p>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-item">
                    <div class="value" id="totalEmployees">0</div>
                    <div class="label">Nhân viên</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="activeToday">0</div>
                    <div class="label">Có mặt</div>
                </div>
            </div>
        </header>

        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="employees"><i class="fas fa-users"></i> Nhân viên</button>
            <button class="nav-tab" data-tab="add"><i class="fas fa-user-plus"></i> Thêm mới</button>
            <button class="nav-tab" data-tab="roles"><i class="fas fa-user-shield"></i> Vai trò</button>
            <button class="nav-tab" data-tab="schedule"><i class="fas fa-clock"></i> Ca làm việc</button>
        </div>

        <!-- Tab: Employee List -->
        <div class="tab-content active" id="tab-employees">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm...">
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-list icon"></i> Danh sách nhân viên</div>
                    <button class="btn btn-primary btn-sm" onclick="openTab('add')"><i class="fas fa-plus"></i>
                        Thêm</button>
                </div>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã NV</th>
                                <th>Họ tên</th>
                                <th>SĐT</th>
                                <th>Vai trò</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Tab: Add Employee -->
        <div class="tab-content" id="tab-add">
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-user-plus icon"></i> Thêm nhân viên</div>
                </div>
                <form id="addEmployeeForm">
                    <div class="grid grid-2">
                        <div class="form-group"><label class="form-label">Họ tên *</label><input type="text"
                                class="form-input" id="fullName" required></div>
                        <div class="form-group"><label class="form-label">SĐT *</label><input type="tel"
                                class="form-input" id="phone" required></div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group"><label class="form-label">Email</label><input type="email"
                                class="form-input" id="email"></div>
                        <div class="form-group"><label class="form-label">Mật khẩu *</label><input type="password"
                                class="form-input" id="password" required></div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group"><label class="form-label">Vai trò *</label><select
                                class="form-input form-select" id="roleId" required></select></div>
                        <div class="form-group"><label class="form-label">Lương</label><input type="number"
                                class="form-input" id="salary"></div>
                    </div>
                    <div class="grid grid-2">
                        <div class="form-group"><label class="form-label">Ngày vào làm *</label><input type="date"
                                class="form-input" id="hireDate" required></div>
                        <div class="form-group"><label class="form-label">Giới tính</label><select
                                class="form-input form-select" id="gender">
                                <option value="male">Nam</option>
                                <option value="female">Nữ</option>
                                <option value="other">Khác</option>
                            </select></div>
                    </div>
                    <div class="form-group"><label class="form-label">Địa chỉ</label><input type="text"
                            class="form-input" id="address"></div>
                    <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px;">
                        <button type="button" class="btn btn-secondary" onclick="openTab('employees')">Hủy</button>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tab: Roles -->
        <div class="tab-content" id="tab-roles">
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-user-shield icon"></i> Vai trò</div>
                </div>
                <div class="grid grid-3" id="rolesContainer"></div>
            </div>
        </div>

        <!-- Tab: Schedule -->
        <div class="tab-content" id="tab-schedule">
            <div class="grid grid-2">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="fas fa-calendar-plus icon"></i> Phân công ca</div>
                    </div>
                    <form id="assignShiftForm">
                        <div class="form-group"><label class="form-label">Nhân viên *</label><select
                                class="form-input form-select" id="shiftEmployeeId" required></select></div>
                        <div class="form-group"><label class="form-label">Ca *</label><select
                                class="form-input form-select" id="shiftId" required></select></div>
                        <div class="form-group"><label class="form-label">Ngày *</label><input type="date"
                                class="form-input" id="workDate" required></div>
                        <button type="submit" class="btn btn-primary" style="width:100%;"><i
                                class="fas fa-calendar-check"></i> Phân công</button>
                    </form>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="fas fa-clock icon"></i> Ca làm việc</div>
                    </div>
                    <div id="shiftsContainer"></div>
                </div>
            </div>
            <div class="card" style="margin-top:24px;">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-table icon"></i> Lịch làm việc</div>
                </div>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Nhân viên</th>
                                <th>Ca</th>
                                <th>Ngày</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="employeeShiftsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Sửa nhân viên</h2><button class="modal-close" onclick="closeEditModal()"><i
                        class="fas fa-times"></i></button>
            </div>
            <form id="editEmployeeForm">
                <input type="hidden" id="editEmployeeId">
                <div class="form-group"><label class="form-label">Họ tên</label><input type="text" class="form-input"
                        id="editFullName" required></div>
                <div class="form-group"><label class="form-label">SĐT</label><input type="tel" class="form-input"
                        id="editPhone" required></div>
                <div class="form-group"><label class="form-label">Vai trò</label><select class="form-input form-select"
                        id="editRoleId"></select></div>
                <div class="form-group"><label class="form-label">Trạng thái</label><select
                        class="form-input form-select" id="editStatus">
                        <option value="active">Đang làm</option>
                        <option value="inactive">Đã nghỉ</option>
                        <option value="on_leave">Nghỉ phép</option>
                    </select></div>
                <div style="display:flex;gap:12px;justify-content:flex-end;"><button type="button"
                        class="btn btn-secondary" onclick="closeEditModal()">Hủy</button><button type="submit"
                        class="btn btn-primary">Lưu</button></div>
            </form>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>

</html>
