<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Supermarket - Đăng nhập</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <span class="logo-icon">🛒</span>
                <h1>Mini Supermarket</h1>
                <p class="subtitle">Hệ thống quản lý siêu thị</p>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="login">Đăng nhập</button>
                <button class="tab-btn" data-tab="register">Đăng ký</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginUsername">Tên đăng nhập</label>
                    <input type="text" id="loginUsername" name="username" placeholder="Nhập tên đăng nhập" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Mật khẩu</label>
                    <input type="password" id="loginPassword" name="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Đăng nhập</span>
                    <span class="btn-loader" style="display:none;">⏳</span>
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regUsername">Tên đăng nhập</label>
                    <input type="text" id="regUsername" name="username" placeholder="Nhập tên đăng nhập" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" name="email" placeholder="Nhập email" required>
                </div>
                <div class="form-group">
                    <label for="regFullname">Họ và tên</label>
                    <input type="text" id="regFullname" name="full_name" placeholder="Nhập họ và tên">
                </div>
                <div class="form-group">
                    <label for="regPhone">Số điện thoại</label>
                    <input type="tel" id="regPhone" name="phone" placeholder="Nhập số điện thoại">
                </div>
                <div class="form-group">
                    <label for="regPassword">Mật khẩu</label>
                    <input type="password" id="regPassword" name="password" placeholder="Ít nhất 6 ký tự, có chữ và số" required>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" id="regConfirmPassword" name="confirm_password" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Đăng ký</span>
                    <span class="btn-loader" style="display:none;">⏳</span>
                </button>
            </form>

            <!-- Message Display -->
            <div id="message" class="message"></div>
        </div>

        <!-- Dashboard (shown after login) -->
        <div id="dashboard" class="dashboard" style="display:none;">
            <div class="dashboard-header">
                <h2>🎉 Chào mừng, <span id="userName"></span>!</h2>
                <button id="logoutBtn" class="btn btn-secondary">Đăng xuất</button>
            </div>
            <div class="user-info">
                <h3>Thông tin tài khoản</h3>
                <div id="userDetails"></div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
